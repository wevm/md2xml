name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: wevm/actions/.github/actions/pnpm@main
      with:
        node-version: 24.5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install xml2rfc
      shell: bash
      run: python -m pip install --upgrade pip==26.2.2 && python -m pip install xml2rfc

    - name: Install dependencies
      shell: bash
      run: pnpm install
